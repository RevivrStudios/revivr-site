<!doctype html><html><head><meta charset="utf-8"><title>Activity model review</title><style>body{margin:0;background:#edf1ed;font:18px system-ui}#labels{position:fixed;top:16px;left:0;right:0;display:flex;justify-content:space-around}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="labels">Watering can · Basil plant · Garden chime · Fish food · Hummingbird</div><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const scene=new T.Scene();scene.background=new T.Color('#edf1ed');const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(0,2.7,7);camera.lookAt(0,.2,0);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);document.body.append(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x7a8070,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(-3,6,4);scene.add(light);const mixers=[];
for(const [i,name]of ['watering-can','potted-plant','garden-chime','fish-food','hummingbird'].entries()){const g=await new GLTFLoader().loadAsync('/openspace/assets/activities/'+name+'.glb');g.scene.updateMatrixWorld(true);const box=new T.Box3().setFromObject(g.scene,true),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());const parent=new T.Group();parent.scale.setScalar(.95/Math.max(size.x,size.y,size.z));g.scene.position.sub(center);parent.add(g.scene);parent.position.set((i-2)*1.25,.2,0);scene.add(parent);const mix=new T.AnimationMixer(g.scene);g.animations.forEach(a=>mix.clipAction(a).play());mixers.push(mix);console.log(name,size.toArray());}
renderer.setAnimationLoop(t=>{mixers.forEach(m=>m.setTime(t/1000));renderer.render(scene,camera);});
</script></body></html>
