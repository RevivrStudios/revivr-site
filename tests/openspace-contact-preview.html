<!doctype html><html><head><base href="/openspace/"><meta charset="utf-8"><title>Garden contact review</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script><style>body{margin:0;font:18px system-ui}nav{position:fixed;top:0;background:white;padding:8px}button,input{font:inherit;margin:5px}</style></head><body><nav><span id="levels"></span><label>Time <input id="age" type="number" value="8" step="0.1" min="-1" max="25"></label><button id="apply">Show frame</button><button id="side">Side view</button><span id="status">Loading</span></nav><script>
// Create the module in-browser so Vite leaves the public experience modules untouched.
const reviewModule=document.createElement("script");reviewModule.type="module";
reviewModule.textContent=`
import * as T from 'three';import{buildActivities}from'/openspace/activities.js';import{buildWildlife}from'/openspace/wildlife.js';import{buildWaterLife}from'/openspace/water-life.js';
const scene=new T.Scene();scene.background=new T.Color('#cedddc');const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,200);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x697657,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(-3,8,4);scene.add(light);let root,act,wild,water,level=0,side=false;
const positions=[[1.65,.92,-2],[3.9,.1,-11.1],[2.25,.8,-25.5],[3.5,.6,-37.65],[2.35,1,-62.7],[2.35,1.15,-88.5]];
async function load(n){level=n;if(root)scene.remove(root);root=new T.Group();scene.add(root);wild=await buildWildlife(root,n,{setDetailedFish(){}});water=n===1?await buildWaterLife(root,n):null;act=await buildActivities(root,n,{wildlife:wild,waterLife:water});act.activate();render();}
function render(){if(!act)return;const t=Number(document.querySelector('#age').value);wild.update(t);act.cycle.age=t<0?null:t;act.update(0,{active:true,reduced:false,viewer:camera.position});const p=new T.Vector3(...positions[level]);camera.position.copy(p).add(side?new T.Vector3(2,.4,1):new T.Vector3(0,level===1?5:.65,level===1?5:2.5));camera.lookAt(p);root.updateMatrixWorld(true);renderer.render(scene,camera);document.querySelector('#status').textContent=act.status;}
['Water','Lilies','Butterfly','Fish','Gong','Bird'].forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>load(i);document.querySelector('#levels').append(b);});document.querySelector('#apply').onclick=render;document.querySelector('#side').onclick=()=>{side=!side;render()};await load(0);
`;
document.body.append(reviewModule);
</script></body></html>
